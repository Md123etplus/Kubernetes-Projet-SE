name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t mohamed046/ry2dr:tag .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.COLLEGUE_DOCKER_USERNAME }}
          password: ${{ secrets.COLLEGUE_DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        run: docker push mohamed046/ry2dr:tag
